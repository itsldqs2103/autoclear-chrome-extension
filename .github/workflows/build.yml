name: Build Chrome Extension CRX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          sudo apt update
          sudo apt install -y chromium

      - name: Create extension key
        env:
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          printf '%s' "$EXTENSION_KEY" > ../extension.pem

      - name: Pack CRX
        run: |
          chromium \
            --headless \
            --no-sandbox \
            --pack-extension="$(pwd)" \
            --pack-extension-key="$(pwd)/../extension.pem"

          mv *.crx "${{ github.event.repository.name }}.crx"

      - name: Remove private key
        run: |
          rm -f ../extension.pem

      - name: Verify CRX
        run: |
          ls -lh "${{ github.event.repository.name }}.crx"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.event.repository.name }}.crx